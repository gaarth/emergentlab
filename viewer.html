<!doctype html>
<html><head><meta charset="utf-8"><title>Autonomous Discovery Lab</title>
<script src="vendor/d3.min.js"></script>
<script>window.d3 || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"><\/script>')</script>
<style>
  :root{--bg:#121212;--panel:#1c1c1e;--fg:#e8e8e8;--muted:#8a8a8a;--acc:#e8724a;--err:#e04848;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.4 -apple-system,Inter,"Segoe UI",sans-serif;display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
  header{display:flex;gap:28px;align-items:center;padding:12px 18px;border-bottom:1px solid #2a2a2a}
  header .q{flex:1;color:var(--muted);font-size:13px;max-height:3.6em;overflow:hidden}
  header .title{font-weight:700;color:var(--fg);font-size:15px;margin-bottom:2px}
  .stat{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .stat b{font-size:26px;color:var(--acc);display:block;letter-spacing:0;font-variant-numeric:tabular-nums}
  .badge{padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;background:#333;white-space:nowrap}
  .badge.running{background:var(--acc);color:#000;animation:pulse 1.2s infinite}
  .badge.writing{background:#e8c14a;color:#000;animation:pulse .6s infinite}
  .badge.done{background:#3a7d44}
  .badge.error{background:var(--err)} .badge.pending{background:#444}
  @keyframes pulse{50%{opacity:.4}}
  #paper-btn{color:var(--acc);font-weight:700;text-decoration:none;border:1px solid var(--acc);padding:5px 12px;border-radius:6px;white-space:nowrap}
  label.toggle{color:var(--muted);font-size:12px;white-space:nowrap;cursor:pointer}
  main{display:grid;grid-template-columns:1fr 460px;min-height:0}
  #tree{overflow:auto} aside{background:var(--panel);padding:16px;overflow:auto;border-left:1px solid #2a2a2a}
  canvas{width:100%;image-rendering:pixelated;background:#000;border-radius:6px;display:block}
  .node{cursor:pointer} .node circle{transition:opacity .3s} .node text{fill:var(--fg);font-size:10px;paint-order:stroke;stroke:var(--bg);stroke-width:3px}
  .link{fill:none;stroke:#444;stroke-width:1.2}
  .node.running circle{animation:pulse 1.2s infinite}
  .node.selected text{fill:var(--acc);font-weight:700}
  .node.fresh text{fill:#fff;font-weight:700} .node.fresh circle{filter:drop-shadow(0 0 6px var(--acc))}
  .dim .node.dead{opacity:.2} .dim .link.dead{opacity:.15}
  #panel h3{margin:10px 0 6px;font-size:16px;line-height:1.35}
  #panel .muted{color:var(--muted)} #panel .small{font-size:12px}
  #panel pre.err{color:#f77;white-space:pre-wrap;background:#241414;padding:10px;border-radius:6px;font-size:12px}
  #panel .metrics{margin:10px 0;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  #panel .metrics div{background:#262628;border-radius:6px;padding:6px 8px;font-size:11px;color:var(--muted)}
  #panel .metrics b{display:block;color:var(--fg);font-size:15px}
  #panel .frames{display:flex;gap:6px;margin-top:8px}
  #panel figure{margin:0;width:24%;text-align:center;font-size:10px;color:var(--muted)}
  #panel figure img{width:100%;image-rendering:pixelated;border-radius:4px;display:block}
  #panel table{border-collapse:collapse;width:100%;font-size:12px;margin-top:8px}
  #panel td,#panel th{border-bottom:1px solid #333;padding:3px 4px;text-align:left}
  .replay-cap{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:12px 0 4px}
</style></head>
<body>
<header>
  <div class="q"><div class="title">Autonomous Discovery Lab</div><span id="question">…</span></div>
  <div class="stat">nodes<b id="s-nodes">0</b></div>
  <div class="stat">experiments<b id="s-exp">0</b></div>
  <div class="stat">elapsed<b id="s-time">0m</b></div>
  <div class="stat">best fitness<b id="s-best">—</b></div>
  <label class="toggle"><input type="checkbox" id="dim-toggle"> dim dead ends</label>
  <span class="badge" id="status">…</span>
</header>
<main>
  <div id="tree"><svg></svg></div>
  <aside id="panel">Click a node.</aside>
</main>
<script>
const params = new URLSearchParams(location.search);
const SRC = params.get("src") || "tree.json";
const POLL = +params.get("poll") || 2000;
const DX = 24, DY = 170;                       // tidy-tree spacing: vertical, per depth level
const svg = d3.select("#tree svg"), g = svg.append("g");
let selected = null, userPicked = false, lastFp = null, tree = null, drawn = false;
window.__panelBuilds = 0; window.__frames = 0; window.__replayTimer = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => typeof v === "number" && isFinite(v);
const fmt1 = v => num(v) ? v.toFixed(1) : "—";

async function tick(){
  let t;
  try {
    const r = await fetch(SRC + (SRC.includes("?") ? "&" : "?") + "t=" + Date.now(), {cache: "no-store"});
    t = await r.json();
  } catch(e) { return; }                        // half-written or missing file: keep the previous tree
  if (!t || !Array.isArray(t.nodes)) return;
  tree = t;
  const nodes = cleanNodes(t);
  drawHeader(t, nodes); drawTree(t, nodes); syncPanel(t, nodes);
}
async function loop(){ try { await tick(); } catch(e) { console.error(e); } setTimeout(loop, POLL); }

function cleanNodes(t){
  const byId = new Map();
  for (const n of t.nodes) if (n && n.id != null) byId.set(String(n.id), {...n, id: String(n.id)});
  return [...byId.values()];
}

function elapsed(t, nodes){
  const t0 = new Date(t.started_at);
  if (isNaN(t0)) return "—";
  let t1 = Date.now();
  if (t.status === "done") {                    // freeze the clock when the run is over
    const ends = nodes.map(n => +new Date(n.ended_at)).filter(x => !isNaN(x));
    if (ends.length) t1 = Math.max(...ends);
  }
  const m = Math.max(0, Math.round((t1 - t0) / 60000));
  return m < 60 ? m + "m" : Math.floor(m / 60) + "h " + (m % 60) + "m";
}

function drawHeader(t, nodes){
  document.getElementById("question").textContent = t.question || "";
  document.getElementById("s-nodes").textContent = nodes.length;
  document.getElementById("s-exp").textContent =
    nodes.reduce((a, n) => a + (Array.isArray(n.rules_tested) ? n.rules_tested.length : 0), 0).toLocaleString("en-US");
  document.getElementById("s-time").textContent = elapsed(t, nodes);
  const fits = nodes.filter(n => n.status === "done" && num(n.fitness)).map(n => n.fitness);
  document.getElementById("s-best").textContent = fits.length ? Math.max(...fits).toFixed(1) : "—";
  const st = document.getElementById("status"), s = String(t.status || "");
  st.textContent = s.replace(/_/g, " ").toUpperCase() || "…";
  st.className = "badge " + ({running: "running", writing_paper: "writing", done: "done"}[s] || "");
  let btn = document.getElementById("paper-btn");
  if (s === "done" && !btn) {
    btn = document.createElement("a"); btn.id = "paper-btn"; btn.href = "paper.html"; btn.target = "_blank";
    btn.textContent = "Read the paper →"; st.after(btn);
  } else if (s !== "done" && btn) btn.remove();
}

function hierarchy(nodes){
  const byId = new Map(nodes.map(n => [n.id, n]));
  const data = {id: "__root", children: []}, map = new Map([["__root", data]]);
  nodes.forEach(n => map.set(n.id, {id: n.id, node: n, children: []}));
  nodes.forEach(n => {
    // orphan- and cycle-safe: a missing parent (or a parent loop) attaches to the invisible root
    let p = n.parent == null ? null : String(n.parent);
    const seen = new Set([n.id]);
    for (let cur = p; cur != null && byId.has(cur); cur = byId.get(cur).parent == null ? null : String(byId.get(cur).parent)) {
      if (seen.has(cur)) { p = null; break; }
      seen.add(cur);
    }
    (p != null && byId.has(p) ? map.get(p) : data).children.push(map.get(n.id));
  });
  return d3.hierarchy(data);
}

function drawTree(t, nodes){
  const root = hierarchy(nodes);
  d3.tree().nodeSize([DX, DY])(root);
  let x0 = Infinity, x1 = -Infinity;
  root.each(d => { if (d.x < x0) x0 = d.x; if (d.x > x1) x1 = d.x; });
  svg.attr("width", Math.max(600, root.height * DY + 260)).attr("height", x1 - x0 + 2 * DX + 20);
  g.attr("transform", `translate(${30 - DY},${DX - x0 + 10})`);   // hide the invisible root column

  const done = nodes.filter(n => n.status === "done" && num(n.fitness));
  const maxF = Math.max(4, ...done.map(n => n.fitness));
  const bestF = done.length ? Math.max(...done.map(n => n.fitness)) : 0;
  const color = d3.scaleLinear().domain([0, maxF]).range(["#4a4a4a", "#ff7a3d"]).interpolate(d3.interpolateHcl);
  const isDead = n => n.status === "error" || (n.status === "done" && bestF > 0 && (n.fitness || 0) < 0.2 * bestF);
  const small = nodes.length <= 40;
  const lk = d3.linkHorizontal().x(d => d.y).y(d => d.x);

  const links = g.selectAll(".link").data(root.links().filter(l => l.source.data.id !== "__root"), d => d.target.data.id);
  links.exit().remove();
  const lEnter = links.enter().insert("path", ".node").attr("class", "link")
    .attr("d", d => lk({source: d.source, target: d.source}));
  lEnter.merge(links).classed("dead", d => isDead(d.target.data.node))
    .transition().duration(400).attr("d", lk);

  const sel = g.selectAll(".node").data(root.descendants().filter(d => d.data.id !== "__root"), d => d.data.id);
  sel.exit().remove();                                            // restarted run -> stale nodes disappear
  const enter = sel.enter().append("g").attr("class", "node").attr("transform", d => `translate(${d.y},${d.x})`)
    .on("click", (e, d) => pick(d.data.id, true));
  enter.append("circle").attr("r", 0).transition().duration(500).attr("r", 7);
  enter.append("text").attr("dx", 11).attr("dy", 4);
  if (drawn) enter.classed("fresh", true).each(function(){ setTimeout(() => d3.select(this).classed("fresh", false), 3000); });
  drawn = true;

  const all = enter.merge(sel);
  all.attr("data-id", d => d.data.id).attr("data-parent", d => d.parent.data.id === "__root" ? "root" : d.parent.data.id)
     .attr("class", function(d){
        const n = d.data.node, keep = this.classList.contains("fresh") ? " fresh" : "";
        return "node " + esc(n.status) + (d.data.id === t.best_node_id ? " best" : "") +
               (d.data.id === selected ? " selected" : "") + (isDead(n) ? " dead" : "") + keep; })
     .transition().duration(400).attr("transform", d => `translate(${d.y},${d.x})`);
  all.select("circle")
     .attr("fill", d => { const n = d.data.node;
        return n.status === "done" ? color(num(n.fitness) ? n.fitness : 0) : n.status === "error" ? "#2a1515" :
               n.status === "running" ? "#6b3522" : "#121212"; })
     .style("stroke", d => d.data.id === t.best_node_id ? "#fff" : d.data.node.status === "error" ? "#e04848" :
                           d.data.node.status === "running" ? "#e8724a" : d.data.node.status === "pending" ? "#888" : "#000")
     .style("stroke-width", d => d.data.id === t.best_node_id ? 2.5 : 1.4)
     .style("stroke-dasharray", d => d.data.node.status === "error" ? "2 2" : null);
  all.select("text").text(d => {
    const n = d.data.node;
    if (n.status === "error") return `${n.id} ✕`;
    if (n.status !== "done") return `${n.id} …`;
    return small ? `${n.id} ${n.best_rule || ""} ${fmt1(n.fitness)}` : `${n.id} ${fmt1(n.fitness)}`;
  });
}

function pick(id, byUser){
  selected = id; lastFp = null; if (byUser) userPicked = true;
  if (byUser) history.replaceState(null, "", location.pathname + location.search + "#" + id);
  if (tree) { const nodes = cleanNodes(tree); drawTree(tree, nodes); syncPanel(tree, nodes); }
}
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (h) pick(h, true); });

function syncPanel(t, nodes){
  const byId = new Map(nodes.map(n => [n.id, n]));
  if (!userPicked) {
    const h = location.hash.slice(1);
    const want = byId.has(h) ? h : (t.best_node_id != null && byId.has(String(t.best_node_id)) ? String(t.best_node_id) : null);
    if (h && byId.has(h)) userPicked = true;
    if (want && want !== selected) { selected = want; lastFp = null; }
  }
  if (!selected) return;
  const n = byId.get(selected);
  if (!n) { selected = null; lastFp = null; stopReplay(); document.getElementById("panel").textContent = "Click a node."; return; }
  const fp = JSON.stringify(n);                  // rebuild only when content changed, so the replay keeps running
  if (fp !== lastFp) { lastFp = fp; showNode(n); }
}

function showNode(n){
  window.__panelBuilds++;
  const m = (n.metrics && typeof n.metrics === "object") ? n.metrics : {};
  const r = n.replay;
  const frames = Array.isArray(n.frames) ? n.frames : [];
  const top = Array.isArray(n.results_top5) ? n.results_top5 : [];
  const metric = (k, v) => `<div>${k}<b>${esc(v)}</b></div>`;
  document.getElementById("panel").innerHTML = `
    <div><span class="badge ${esc(n.status)}">${esc(n.status || "—")}</span> <b>${esc(n.id)}</b>
      <span class="muted">← ${esc(n.parent ?? "root")} · depth ${esc(n.depth ?? "—")}</span></div>
    <h3>${esc(n.hypothesis) || "—"}</h3>
    <div class="muted">${esc(n.notes)}</div>
    ${n.error ? `<pre class="err">${esc(n.error)}</pre>` : ""}
    <div class="metrics">
      ${metric("best rule", n.best_rule || "—")}${metric("fitness", num(n.fitness) ? n.fitness : "—")}${metric("copies", m.copies ?? "—")}
      ${metric("alive", m.alive ?? "—")}${metric("growth", num(m.growth) ? m.growth.toFixed(2) : "—")}
      ${metric("stable", m.stable == null ? "—" : m.stable ? "yes" : "no")}
    </div>
    <div class="muted small">tested (${(n.rules_tested || []).length}): ${esc((Array.isArray(n.rules_tested) ? n.rules_tested : []).join(", ")) || "—"}</div>
    ${r ? `<div class="replay-cap"><span>replay · <b>${esc(r.rule)}</b> · ${esc(r.size ?? 64)}² torus</span><span id="replay-t">t=0</span></div>
           <canvas id="replay" width="64" height="64"></canvas>` : ""}
    ${frames.length ? `<div class="frames">${frames.map(f => { const tt = /_(\d+)\.png$/.exec(f);
        return `<figure><img src="${esc(f)}" alt="" onerror="this.style.visibility='hidden'"><figcaption>${tt ? "t=" + tt[1] : ""}</figcaption></figure>`; }).join("")}</div>` : ""}
    ${top.length ? `<table><tr><th>rule</th><th>copies</th><th>alive</th><th>stable</th><th>fitness</th></tr>${top.map(x =>
        `<tr><td>${esc(x.rule)}</td><td>${esc(x.copies)}</td><td>${esc(x.alive)}</td><td>${esc(x.stable)}</td><td>${esc(x.fitness)}</td></tr>`).join("")}</table>` : ""}`;
  stopReplay();
  if (r) { try { startReplay(r); } catch(e) { console.warn("replay failed", e); } }
}

// ---- CA engine: JS twin of ca.py (same rule parsing, torus wrap, seed centring) ----
function parseRule(rule){
  const [b, s] = String(rule).toUpperCase().split("/");
  if (s === undefined) throw new Error("bad rule " + rule);
  return [new Set([...b.slice(1)].map(Number)), new Set([...s.slice(1)].map(Number))];
}
function placeSeed(seed, size){
  const grid = new Uint8Array(size * size);
  const oy = Math.floor((size - seed.length) / 2), ox = Math.floor((size - (seed[0] || []).length) / 2);
  seed.forEach((row, y) => row.forEach((v, x) => { if (v) grid[(oy + y) * size + ox + x] = 1; }));
  return grid;
}
function stepGrid(grid, birth, surv, size){
  const next = new Uint8Array(size * size);
  for (let y = 0; y < size; y++) {
    const ym = ((y - 1 + size) % size) * size, y0 = y * size, yp = ((y + 1) % size) * size;
    for (let x = 0; x < size; x++) {
      const xm = (x - 1 + size) % size, xp = (x + 1) % size;
      const n = grid[ym + xm] + grid[ym + x] + grid[ym + xp] + grid[y0 + xm] + grid[y0 + xp] + grid[yp + xm] + grid[yp + x] + grid[yp + xp];
      next[y0 + x] = grid[y0 + x] ? (surv.has(n) ? 1 : 0) : (birth.has(n) ? 1 : 0);
    }
  }
  return next;
}
window.stepCA = function(rule, seed, size = 64, steps = 0){
  const [b, s] = parseRule(rule); let grid = placeSeed(seed, size);
  for (let i = 0; i < steps; i++) grid = stepGrid(grid, b, s, size);
  return Array.from(grid);
};

let replayTimer = null;
function stopReplay(){ clearInterval(replayTimer); replayTimer = null; window.__replayTimer = null; }
function startReplay({rule, seed, size = 64, steps = 60}){          // size must match ca.evaluate (64)
  if (!Array.isArray(seed) || !seed.length || !Array.isArray(seed[0])) return;
  size = Number.isInteger(size) && size >= 8 && size <= 512 ? size : 64;
  steps = Number.isInteger(steps) && steps > 0 ? steps : 60;
  const [b, s] = parseRule(rule);
  const start = placeSeed(seed, size); let grid = start.slice(), t = 0, hold = 0;
  const cv = document.getElementById("replay"); cv.width = size; cv.height = size;
  const ctx = cv.getContext("2d"), img = ctx.createImageData(size, size), lbl = document.getElementById("replay-t");
  function draw(){
    for (let i = 0; i < size * size; i++) {
      const on = grid[i]; img.data[i*4] = on ? 232 : 0; img.data[i*4+1] = on ? 114 : 0; img.data[i*4+2] = on ? 74 : 0; img.data[i*4+3] = 255;
    }
    ctx.putImageData(img, 0, 0); if (lbl) lbl.textContent = `t=${t}/${steps}`; window.__frames++;
  }
  draw();
  replayTimer = setInterval(() => {
    if (t >= steps) { if (++hold < 10) { draw(); return; } grid = start.slice(); t = 0; hold = 0; }   // brief pause on the last frame
    else { grid = stepGrid(grid, b, s, size); t++; }
    draw();
  }, 66);                                                                                         // ~15 fps
  window.__replayTimer = replayTimer;
}

document.getElementById("dim-toggle").addEventListener("change", e => document.getElementById("tree").classList.toggle("dim", e.target.checked));
loop();
</script>
</body></html>
